{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
# Two years of purchase history, the recipe library, the cart ledger and the
# Kroger refresh token. The only thing here that cannot be rebuilt, which is why
# it wants real local disk: SQLite in WAL mode over network storage corrupts.
#
# Kept on an uninstall — helm would otherwise delete the database along with the
# release.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "meal-planner.claimName" . }}
  labels: {{- include "meal-planner.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
