{{- range $secret, $item := .Values.onePassword.items }}
---
# itemPath is vaults/<vault>/items/<item>. The operator creates a Secret named
# after this resource, keyed by the item's field labels.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ $secret }}
  labels: {{- include "meal-planner.labels" $ | nindent 4 }}
  annotations:
    operator.1password.io/auto-restart: {{ $.Values.onePassword.autoRestart | quote }}
spec:
  itemPath: "vaults/{{ $.Values.onePassword.vault }}/items/{{ $item }}"
{{- end }}
